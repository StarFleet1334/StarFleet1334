name: log

# Rebuilds README.md from README.tpl.md + the live GitHub API.
#
# The build takes no value from the wall clock, so a run on a quiet day
# produces a byte-identical file and commits nothing. The commit step is
# therefore safe to run as often as you like — the history stays a record of
# what actually changed, not of the cron firing.

on:
  schedule:
    # Hourly, at :17. There is no GitHub event for "I created or deleted a
    # repository" — personal accounts have no account-level webhooks, and
    # create/delete events are about branches inside one repo. Polling is
    # therefore the only mechanism available, so the cadence IS the freshness.
    # An odd minute on purpose: everything scheduled on the hour lands in the
    # same queue, and a busy queue is how a cron silently slips.
    #
    # Hourly is affordable precisely because the build is idempotent: 23 of
    # the 24 daily runs find nothing changed and commit nothing. Actions
    # minutes are unmetered on public repositories.
    - cron: "17 * * * *"
  workflow_dispatch:
  # Instant refresh from anywhere, without waiting for the hour:
  #   gh api repos/StarFleet1334/StarFleet1334/dispatches -f event_type=refresh
  repository_dispatch:
    types: [refresh]
  push:
    # Both names. A repo created with a "master" default silently matches
    # nothing here, and the symptom is a push that triggers no run at all —
    # which reads as a broken workflow rather than a filter that missed.
    branches: [main, master]
    paths:
      - "README.tpl.md"
      - "manifest.json"
      - "decks.json"
      - ".github/build.py"
      - ".github/workflows/log.yml"

permissions:
  contents: write

concurrency:
  group: log
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # PROFILE_TOKEN when it exists, because GITHUB_TOKEN is forbidden
          # from pushing changes to any file under .github/workflows/ — and
          # the survey dropdown lives in one. Without the secret the roster
          # step below is skipped and everything else works unchanged.
          token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: rebuild the log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .github/build.py

      # This is what makes "I created a repo" and "I deleted a repo" reach the
      # survey form: its dropdown is static YAML, so it is rewritten here on
      # the same schedule the page is.
      #
      # There is no `if:` here on purpose. The `secrets` context is not
      # available to an `if:` expression — GitHub rejects the whole file with
      # "Unrecognized named-value: 'secrets'" — so the guard lives inside
      # roster.py, which sees PROFILE_TOKEN as an ordinary environment
      # variable and declines to touch the file when it is absent.
      - name: refresh the survey dropdown
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .github/roster.py

      - name: commit, only if something moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/survey.yml
          if git diff --cached --quiet; then
            echo "no change — the log stands"
            exit 0
          fi
          git commit -m "log: $(git diff --cached --shortstat | xargs)"
          git push
